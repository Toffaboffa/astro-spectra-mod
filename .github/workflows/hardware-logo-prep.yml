name: Prepare hardware manufacturer logos

on:
  push:
    branches:
      - startup-hardware-calibration-ux
    paths:
      - .github/workflows/hardware-logo-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: startup-hardware-calibration-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: python -m pip install --quiet pillow requests beautifulsoup4 cairosvg pymupdf
      - name: Discover official manufacturer logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/logo-src docs/frontend/assets/hardware/logos
          python - <<'PY'
          import io, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          from pathlib import Path

          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'}
          brands=[
            ('kvant','KVANT','https://www.kvant.sk/',['kvant']),
            ('vernier','Vernier','https://www.vernier.com/',['vernier']),
            ('pasco','PASCO','https://www.pasco.com/',['pasco']),
            ('ocean-optics','Ocean Optics','https://www.oceanoptics.com/',['ocean','logo']),
            ('avantes','Avantes','https://www.avantes.com/',['avantes']),
            ('hamamatsu','Hamamatsu Photonics','https://www.hamamatsu.com/',['hamamatsu']),
          ]

          def attr_text(tag):
            vals=[]
            for k in ('alt','title','class','id','src','data-src','data-lazy-src'):
              v=tag.get(k)
              if isinstance(v,list): vals.extend(v)
              elif v: vals.append(str(v))
            return ' '.join(vals).lower()

          def candidate_urls(page, html, aliases):
            soup=BeautifulSoup(html,'html.parser')
            out=[]
            for tag in soup.find_all(['img','source']):
              src=tag.get('src') or tag.get('data-src') or tag.get('data-lazy-src') or tag.get('srcset')
              if not src: continue
              if ',' in src: src=src.split(',')[0].strip().split(' ')[0]
              txt=attr_text(tag)
              score=0
              if 'logo' in txt: score += 120
              if 'header' in txt or 'brand' in txt: score += 30
              for alias in aliases:
                if alias.lower() in txt: score += 50
              if any(x in txt for x in ('footer','partner','customer','certif')): score -= 35
              out.append((score,urljoin(page,src),txt[:220]))
            for tag in soup.find_all('link'):
              rel=' '.join(tag.get('rel') or []).lower()
              href=tag.get('href')
              if href and ('icon' not in rel) and ('logo' in (href or '').lower()):
                out.append((90,urljoin(page,href),'link-logo'))
            seen=set()
            result=[]
            for item in sorted(out,key=lambda x:x[0],reverse=True):
              if item[1] not in seen:
                seen.add(item[1]); result.append(item)
            return result

          for slug,label,page,aliases in brands:
            print('PAGE',label,page)
            r=requests.get(page,headers=H,timeout=40)
            r.raise_for_status()
            candidates=candidate_urls(page,r.text,aliases)
            selected=None
            for score,u,why in candidates:
              if score < 40: continue
              try:
                rr=requests.get(u,headers={**H,'Referer':page},timeout=35)
                ct=rr.headers.get('content-type','').split(';')[0].lower()
                data=rr.content
                if not rr.ok or len(data)<500:
                  continue
                lower=u.lower()
                if 'svg' in ct or lower.endswith('.svg'):
                  ext='.svg'
                elif 'png' in ct or '.png' in lower:
                  ext='.png'
                elif 'webp' in ct or '.webp' in lower:
                  ext='.webp'
                elif 'jpeg' in ct or 'jpg' in ct or '.jpg' in lower or '.jpeg' in lower:
                  ext='.jpg'
                else:
                  continue
                dest=Path('/tmp/logo-src')/(slug+ext)
                dest.write_bytes(data)
                selected=(u,score,why,ct,str(dest))
                break
              except Exception as e:
                print('SKIP',label,u,type(e).__name__)
            if not selected:
              print('CANDIDATES',label,candidates[:8])
              raise SystemExit('No usable official logo discovered for '+label)
            print('SELECTED',label,*selected)

          # StellarNet's current site hides its logo from static HTML. Extract the official logo
          # from the first page of StellarNet's own spectrometer features manual.
          import fitz
          stellar_pdf='https://www.stellarnet.us/wp-content/uploads/06-Spectrometer-Upgrades-and-Features.pdf'
          rr=requests.get(stellar_pdf,headers=H,timeout=40)
          rr.raise_for_status()
          doc=fitz.open(stream=rr.content,filetype='pdf')
          page=doc[0]
          pix=page.get_pixmap(matrix=fitz.Matrix(2.4,2.4),alpha=False)
          from PIL import Image
          im=Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGB')
          w,h=im.size
          # Logo is in the upper-left of the manual page.
          crop=im.crop((0,0,int(w*0.48),int(h*0.22)))
          px=crop.load()
          mask=Image.new('L',crop.size,0)
          mp=mask.load()
          for y in range(crop.height):
            for x in range(crop.width):
              r,g,b=px[x,y]
              if min(r,g,b)<238 or max(r,g,b)-min(r,g,b)>15:
                mp[x,y]=255
          box=mask.getbbox()
          if not box:
            raise SystemExit('Could not isolate StellarNet logo from official manual')
          l,t,r,b=box
          pad=18
          crop=crop.crop((max(0,l-pad),max(0,t-pad),min(crop.width,r+pad),min(crop.height,b+pad)))
          crop.save('/tmp/logo-src/stellarnet.png','PNG')
          print('SELECTED StellarNet',stellar_pdf,'official manual logo')

          # Thorlabs does not expose a normal header logo image in the current site HTML.
          # Extract the official red wordmark from the first page of Thorlabs' own OEM brochure.
          import fitz
          pdf_url='https://www.thorlabs.com/images/TabImages/Thorlabs_OEM_Brochure_0116.pdf'
          rr=requests.get(pdf_url,headers=H,timeout=40)
          rr.raise_for_status()
          doc=fitz.open(stream=rr.content,filetype='pdf')
          page=doc[0]
          pix=page.get_pixmap(matrix=fitz.Matrix(2.4,2.4),alpha=False)
          png=pix.tobytes('png')
          from PIL import Image
          im=Image.open(io.BytesIO(png)).convert('RGB')
          w,h=im.size
          crop=im.crop((int(w*0.58),int(h*0.72),w,int(h*0.98)))
          px=crop.load()
          mask=Image.new('L',crop.size,0)
          mp=mask.load()
          for y in range(crop.height):
            for x in range(crop.width):
              r,g,b=px[x,y]
              # isolate Thorlabs' red wordmark while ignoring black body text
              if r>110 and r>g*1.25 and r>b*1.25:
                mp[x,y]=255
          box=mask.getbbox()
          if not box:
            raise SystemExit('Could not isolate Thorlabs logo from official brochure')
          l,t,r,b=box
          pad=18
          crop=crop.crop((max(0,l-pad),max(0,t-pad),min(crop.width,r+pad),min(crop.height,b+pad)))
          crop.save('/tmp/logo-src/thorlabs.png','PNG')
          print('SELECTED Thorlabs',pdf_url,'official PDF cover logo')
          PY
      - name: Normalize logos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import cairosvg, io

          src=Path('/tmp/logo-src')
          out=Path('docs/frontend/assets/hardware/logos')
          out.mkdir(parents=True,exist_ok=True)

          names=['kvant','vernier','pasco','ocean-optics','thorlabs','avantes','stellarnet','hamamatsu']

          def open_any(path):
            if path.suffix.lower()=='.svg':
              png=cairosvg.svg2png(bytestring=path.read_bytes(),output_width=1200)
              return Image.open(io.BytesIO(png)).convert('RGBA')
            return Image.open(path).convert('RGBA')

          def crop_content(im):
            # Preserve transparency; if opaque white, trim near-white margins.
            alpha=im.getchannel('A')
            if alpha.getbbox() and alpha.getextrema()[0] < 250:
              box=alpha.getbbox()
              return im.crop(box) if box else im
            rgb=Image.new('RGB',im.size,'white')
            rgb.paste(im,mask=alpha)
            px=rgb.load()
            mask=Image.new('L',rgb.size,0)
            mp=mask.load()
            for y in range(rgb.height):
              for x in range(rgb.width):
                r,g,b=px[x,y]
                if min(r,g,b)<245 or max(r,g,b)-min(r,g,b)>12:
                  mp[x,y]=255
            box=mask.getbbox()
            return im.crop(box) if box else im

          for name in names:
            matches=list(src.glob(name+'.*'))
            assert matches, name
            im=crop_content(open_any(matches[0]))
            im.thumbnail((280,88),Image.Resampling.LANCZOS)
            canvas=Image.new('RGBA',(320,120),(0,0,0,0))
            canvas.alpha_composite(im,((320-im.width)//2,(120-im.height)//2))
            canvas.save(out/(name+'.png'),'PNG',optimize=True)
            with Image.open(out/(name+'.png')) as check:
              assert check.size==(320,120)
          PY
      - name: Wire logo URLs into hardware catalog
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('docs/frontend/data/hardware_profiles.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          manufacturer_map={
            'KVANT':'kvant.png',
            'Vernier':'vernier.png',
            'PASCO':'pasco.png',
            'Ocean Optics':'ocean-optics.png',
            'Thorlabs':'thorlabs.png',
            'Avantes':'avantes.png',
            'StellarNet':'stellarnet.png',
            'Hamamatsu Photonics':'hamamatsu.png',
          }
          for profile in data.get('profiles',[]):
            fn=manufacturer_map.get(profile.get('manufacturer'))
            if fn:
              profile['logoUrl']='../assets/hardware/logos/'+fn
          missing=[x['profileId'] for x in data['profiles'] if not x.get('logoUrl')]
          assert not missing, 'Missing logoUrl: '+', '.join(missing)
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          prov_path=Path('docs/frontend/assets/hardware/sources.json')
          prov=json.loads(prov_path.read_text(encoding='utf-8'))
          prov['logos']=[
            {'file':'logos/kvant.png','manufacturer':'KVANT','sourcePage':'https://www.kvant.sk/','sourceKind':'manufacturer-site-logo'},
            {'file':'logos/vernier.png','manufacturer':'Vernier','sourcePage':'https://www.vernier.com/','sourceKind':'manufacturer-site-logo'},
            {'file':'logos/pasco.png','manufacturer':'PASCO','sourcePage':'https://www.pasco.com/','sourceKind':'manufacturer-site-logo'},
            {'file':'logos/ocean-optics.png','manufacturer':'Ocean Optics','sourcePage':'https://www.oceanoptics.com/','sourceKind':'manufacturer-site-logo'},
            {'file':'logos/thorlabs.png','manufacturer':'Thorlabs','sourcePage':'https://www.thorlabs.com/','sourceKind':'manufacturer-site-logo'},
            {'file':'logos/avantes.png','manufacturer':'Avantes','sourcePage':'https://www.avantes.com/','sourceKind':'manufacturer-site-logo'},
            {'file':'logos/stellarnet.png','manufacturer':'StellarNet','sourcePage':'https://www.stellarnet.us/wp-content/uploads/06-Spectrometer-Upgrades-and-Features.pdf','sourceKind':'manufacturer-document-logo'},
            {'file':'logos/hamamatsu.png','manufacturer':'Hamamatsu Photonics','sourcePage':'https://www.hamamatsu.com/','sourceKind':'manufacturer-site-logo'}
          ]
          prov_path.write_text(json.dumps(prov,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Validate complete logo coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          data=json.loads(Path('docs/frontend/data/hardware_profiles.json').read_text())
          missing=[p['profileId'] for p in data['profiles'] if not p.get('logoUrl')]
          assert not missing, missing
          paths=set()
          for p in data['profiles']:
            rel=p['logoUrl'].replace('../assets/hardware/','')
            fp=Path('docs/frontend/assets/hardware')/rel
            assert fp.exists(), (p['profileId'],fp)
            with Image.open(fp) as im:
              assert im.size==(320,120), (fp,im.size)
              assert im.mode in ('RGBA','LA','P'), (fp,im.mode)
            paths.add(str(fp))
          assert len(paths)==8, paths
          print('Logo coverage:',len(data['profiles']),'profiles,',len(paths),'manufacturer logos')
          PY
      - name: Commit logos and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hardware-logo-prep.yml
          git add docs/frontend/assets/hardware/logos docs/frontend/assets/hardware/sources.json docs/frontend/data/hardware_profiles.json
          git commit -m "Add manufacturer logos for hardware popup"
          git push origin HEAD:startup-hardware-calibration-ux
