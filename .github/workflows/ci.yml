name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend smoke / tests (skip if no backend)
        shell: bash
        run: |
          set -e
          if [ ! -d backend ]; then
            echo "No backend/ directory yet. Skipping backend-tests."
            exit 0
          fi
          cd backend
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pytest.ini ] || [ -d tests ]; then pytest -q; else echo "No backend tests found."; fi

  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run main compatibility regressions
        run: node tests/main_compatibility.test.mjs
      - name: Run calibration runtime regressions
        run: node tests/calibration_runtime_regression.test.mjs
      - name: Run compact scientific analysis regressions
        run: node tests/analysis_regression.test.js
      - name: Run AI context regressions
        run: node tests/ai_context_regression.test.mjs
      - name: Enforce compact AI token budget
        run: node tests/ai_token_budget.test.mjs
      - name: Run UI consolidation regressions
        run: node tests/ui_consolidation.test.mjs
      - name: Run export reproducibility regressions
        run: node tests/export_reproducibility.test.mjs
      - name: Run PDF report contract regressions
        run: node tests/pdf_report_contract.test.mjs
      - name: Run repository contract regressions
        run: node tests/repository_contract.test.mjs
      - name: Validate script/style paths
        run: |
          set -e
          if grep -R "\.\./components/" -n docs/frontend/pages/recording.html; then
            echo "recording.html still references ../components/. Use ../scripts/." >&2
            exit 1
          fi
          # Ensure referenced CSS files exist
          (test -f docs/frontend/styles/customColorsStyle.css || test -f docs/frontend/styles/styles.css)
          (test -f docs/frontend/styles/recordingStyle.css || test -f docs/frontend/styles/styles.css)

      - name: Validate bundled spectral samples and icons
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import struct
          import json

          image = Path("docs/frontend/assets/examples/n2-spectral-tube/n2-spectral-tube.png")
          data = image.read_bytes()
          assert len(data) == 82296, f"Unexpected N2 example size: {len(data)}"
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "N2 example is not a PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (1280, 720), f"Unexpected N2 dimensions: {(width, height)}"
          digest = hashlib.sha256(data).hexdigest()
          expected = "dc624e7ca38032b9ca6c93e09f14feec476617c35742316e4f6063b050e3bbea"
          assert digest == expected, f"N2 SHA-256 mismatch: {digest}"

          module = Path("docs/frontend/scripts/mod/exampleSpectrumUi.js").read_text(encoding="utf-8")
          assert "n2-spectral-tube.png" in module
          assert "ne-spectral-tube.png" in module
          assert "ne-spectral-tube.webp" not in module
          assert "spectral-tube-purple-128.png" in module
          assert "spectral-tube-orange-128.png" in module
          assert "spectral-tube-cyan-128.png" in module
          n2_start = module.index("id: 'n2-spectral-tube'")
          ne_start = module.index("id: 'ne-spectral-tube'")
          ar_start = module.index("id: 'ar-spectral-tube'")
          solar_start = module.index("id: 'solar-tsis1-hsrs'")
          n2_block = module[n2_start:ne_start]
          ne_block = module[ne_start:ar_start]
          ar_block = module[ar_start:solar_start]
          assert "icon: SAMPLE_ICONS.purple" in n2_block, "N2 sample must use the purple tube icon"
          assert "icon: SAMPLE_ICONS.orange" in ne_block, "Ne sample must use the orange tube icon"
          assert "icon: SAMPLE_ICONS.cyan" in ar_block, "Ar sample must use the cyan tube icon"
          assert "icon: SAMPLE_ICONS.cyan" not in n2_block + ne_block, "Cyan icon must remain exclusive to the Argon sample"
          assert "chunk-" not in module
          assert "const VERSION = '3.1.2';" in module
          assert "solar-tsis1-hsrs-visible-0p2nm.json" in module

          export_ui = Path("docs/frontend/scripts/mod/exportUi.js").read_text(encoding="utf-8")
          assert "const rotatedSourceUrl = croppedSourceUrl ? (await rotateDataUrl90(croppedSourceUrl) || croppedSourceUrl) : '';" in export_ui
          assert "const sourceH = graphH;" in export_ui
          assert "await addImageFitToBox(doc, rotatedSourceUrl, sourceX, visualTop, sourceW, sourceH);" in export_ui

          ne = Path("docs/frontend/assets/examples/ne-spectral-tube/ne-spectral-tube.png")
          ne_data = ne.read_bytes()
          assert len(ne_data) == 43805, f"Unexpected Ne example size: {len(ne_data)}"
          assert ne_data[:8] == b"\x89PNG\r\n\x1a\n", "Ne example is not a PNG"
          ne_width, ne_height = struct.unpack(">II", ne_data[16:24])
          assert (ne_width, ne_height) == (1280, 720), f"Unexpected Ne dimensions: {(ne_width, ne_height)}"
          ne_digest = hashlib.sha256(ne_data).hexdigest()
          assert ne_digest == "fbef80cbc7637f3220e4eaba31ad4c9e1e8de987fdf93537ce653d5518cbd1f0", f"Ne SHA-256 mismatch: {ne_digest}"

          icon_expectations = {
              "purple": (8646, "d4b8bb301be315b0270807048d15cda227057c0cbc989a6f8e929a88599791d4"),
              "orange": (9129, "2f15160ad4d182d678a810f47df796c78a8eac4c371bb670ad7aa775a77e9a1a"),
              "cyan": (8522, "5c7bda21e42cff8cdaaf5025b0da8c0561163f025631dc01d80727a6105ea204"),
          }
          for name, (expected_size, expected_digest) in icon_expectations.items():
              icon_data = Path(f"docs/frontend/assets/examples/icons/spectral-tube-{name}-128.png").read_bytes()
              assert len(icon_data) == expected_size, f"Unexpected {name} icon size: {len(icon_data)}"
              assert icon_data[:8] == b"\x89PNG\r\n\x1a\n", f"{name} icon is not PNG"
              w, h = struct.unpack(">II", icon_data[16:24])
              assert (w, h) == (128, 128), f"Unexpected {name} icon dimensions: {(w, h)}"
              icon_digest = hashlib.sha256(icon_data).hexdigest()
              assert icon_digest == expected_digest, f"{name} icon SHA-256 mismatch: {icon_digest}"

          argon = Path("docs/frontend/data/examples/ar-spectral-tube.json")
          argon_json = json.loads(argon.read_text(encoding="utf-8"))
          assert argon_json["schema"] == "spectra-pro-rgb-spectrum-example/v1"
          assert argon_json["id"] == "ar-spectral-tube"
          assert argon_json["scientificRole"] == "measured-example-spectrum"
          assert argon_json["sampleCount"] == 1280
          assert len(argon_json["px"]) == len(argon_json["nm"]) == len(argon_json["R"]) == len(argon_json["G"]) == len(argon_json["B"]) == len(argon_json["I"]) == 1280
          assert argon_json["calibration"]["points"] == [{"px": 32, "nm": 388.86}, {"px": 515, "nm": 587.57}, {"px": 1110, "nm": 837.76}]
          assert all(argon_json["nm"][i] < argon_json["nm"][i + 1] for i in range(1279))

          solar = Path("docs/frontend/data/examples/solar-tsis1-hsrs-visible-0p2nm.json")
          solar_data = solar.read_bytes().replace(b"\r\n", b"\n")
          assert hashlib.sha256(solar_data).hexdigest() == "195a31f7d495a2a236bbb43a44b4c8573fb765703750c0dc66e5c8525aa9854c"
          solar_json = json.loads(solar_data)
          assert solar_json["schema"] == "spectra-pro-numeric-example/v1"
          assert solar_json["wavelengthMedium"] == "standard-air"
          assert solar_json["grid"] == {"startNm": 388, "endNm": 670, "stepNm": 0.2, "count": 1411}
          assert len(solar_json["wavelengthNm"]) == len(solar_json["irradianceWm2Nm"]) == 1411
          assert solar_json["provenance"]["primaryReferenceDoi"] == "10.1029/2020GL091709"

          cal_io = Path("docs/frontend/scripts/mod/calibrationIO.js").read_text(encoding="utf-8")
          assert "suppressAxisPromptFor" in cal_io
          assert "if (axisPromptSuppressed())" in cal_io
          assert "if (!axisPromptSuppressed()) showAxisQuestion();" in cal_io
          assert "function isWavelengthAxisSelected()" in cal_io
          assert "if (isWavelengthAxisSelected())" in cal_io
          suppress_call = "suppressAxisPromptFor(1500)"
          calibration_call = "const calibration = applyCalibration(sample);"
          assert suppress_call in module, "Sample loader no longer suppresses the redundant wavelength-axis prompt"
          assert module.index(suppress_call) < module.index(calibration_call), "Axis-prompt suppression must be armed before sample calibration"
          assert "selectWavelengthAxis();" in module, "Sample loader no longer switches calibrated samples directly to wavelength"
          PY
