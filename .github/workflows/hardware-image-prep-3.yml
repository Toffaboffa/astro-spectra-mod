name: Prepare hardware image batch 3

on:
  push:
    branches:
      - startup-hardware-calibration-ux
    paths:
      - .github/workflows/hardware-image-prep-3.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: startup-hardware-calibration-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: python -m pip install --quiet pillow requests beautifulsoup4
      - name: Discover and download product photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hardware-src docs/frontend/assets/hardware
          python - <<'PY'
          import requests, re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from pathlib import Path

          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'}
          targets=[
            ('stellarnet-blue-wave','https://www.stellarnet.us/spectrometers/uv-vis-spectrometers/blue-wave/', ['blue-wave','blue wave','spectrometer']),
            ('hamamatsu-c12880ma','https://www.hamamatsu.com/jp/en/product/optical-sensors/spectrometers/mini-spectrometer/C12880MA.html', ['c12880ma']),
            ('hamamatsu-c11708ma','https://www.hamamatsu.com/us/en/product/optical-sensors/spectrometers/mini-spectrometer/C11708MA.html', ['c11708ma','c10988ma']),
          ]

          def candidates(page, keys):
            r=requests.get(page,headers=H,timeout=35)
            r.raise_for_status()
            soup=BeautifulSoup(r.text,'html.parser')
            out=[]
            for prop in [('property','og:image'),('name','twitter:image')]:
              tag=soup.find('meta',attrs={prop[0]:prop[1]})
              if tag and tag.get('content'):
                out.append((20,urljoin(page,tag['content']),'meta'))
            for img in soup.find_all('img'):
              src=img.get('src') or img.get('data-src') or img.get('data-lazy-src') or img.get('data-original')
              if not src: continue
              alt=' '.join([img.get('alt') or '',img.get('title') or '',src]).lower()
              score=0
              for k in keys:
                if k.lower() in alt: score+=50
              if 'product' in alt: score+=10
              if 'logo' in alt or 'icon' in alt: score-=40
              out.append((score,urljoin(page,src),alt[:160]))
            seen=set()
            return [x for x in sorted(out,key=lambda x:x[0],reverse=True) if not (x[1] in seen or seen.add(x[1]))]

          for name,page,keys in targets:
            print('PAGE',name,page)
            ok=False
            for score,u,why in candidates(page,keys):
              if score < 0: continue
              try:
                r=requests.get(u,headers={**H,'Referer':page},timeout=35)
                ct=r.headers.get('content-type','')
                if r.ok and len(r.content)>8000 and ct.startswith('image/'):
                  ext='.png' if 'png' in ct else '.webp' if 'webp' in ct else '.jpg'
                  dest=Path('/tmp/hardware-src')/(name+ext)
                  dest.write_bytes(r.content)
                  print('SELECTED',name,score,u,ct,len(r.content),why)
                  ok=True
                  break
              except Exception as e:
                print('SKIP',name,u,type(e).__name__)
            if not ok:
              raise SystemExit('No usable image discovered for '+name)
          PY
      - name: Normalize images to UI format
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          srcdir=Path('/tmp/hardware-src')
          outdir=Path('docs/frontend/assets/hardware')
          outdir.mkdir(parents=True,exist_ok=True)

          names=['stellarnet-blue-wave','hamamatsu-c12880ma','hamamatsu-c11708ma']

          def trim_near_white(im):
            rgb=im.convert('RGB')
            px=rgb.load()
            mask=Image.new('L',rgb.size,0)
            mp=mask.load()
            for y in range(rgb.height):
              for x in range(rgb.width):
                r,g,b=px[x,y]
                if min(r,g,b)<246 or max(r,g,b)-min(r,g,b)>10:
                  mp[x,y]=255
            box=mask.getbbox()
            if not box: return rgb
            l,t,r,b=box
            pad=max(8,int(max(rgb.size)*0.025))
            return rgb.crop((max(0,l-pad),max(0,t-pad),min(rgb.width,r+pad),min(rgb.height,b+pad)))

          for name in names:
            matches=list(srcdir.glob(name+'.*'))
            assert matches, name
            im=Image.open(matches[0]).convert('RGB')
            im=trim_near_white(im)
            im.thumbnail((570,390),Image.Resampling.LANCZOS)
            canvas=Image.new('RGB',(640,480),'white')
            canvas.paste(im,((640-im.width)//2,(480-im.height)//2))
            canvas.save(outdir/(name+'.jpg'),'JPEG',quality=84,optimize=True,progressive=True)
          PY
      - name: Update profile image links and provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path=Path('docs/frontend/data/hardware_profiles.json')
          data=json.loads(catalog_path.read_text(encoding='utf-8'))
          urls={
            'thorlabs-ccs200':'../assets/hardware/thorlabs-ccs-series.jpg',
            'stellarnet-blue-wave-vis-25':'../assets/hardware/stellarnet-blue-wave.jpg',
            'hamamatsu-c12880ma':'../assets/hardware/hamamatsu-c12880ma.jpg',
            'hamamatsu-c11708ma':'../assets/hardware/hamamatsu-c11708ma.jpg',
          }
          for profile in data.get('profiles',[]):
            pid=profile.get('profileId')
            if pid in urls: profile['imageUrl']=urls[pid]
          catalog_path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          src_path=Path('docs/frontend/assets/hardware/sources.json')
          provenance=json.loads(src_path.read_text(encoding='utf-8'))
          existing={x.get('file') for x in provenance.get('assets',[])}
          additions=[
            {
              'file':'stellarnet-blue-wave.jpg',
              'profiles':['stellarnet-blue-wave-vis-25'],
              'sourcePage':'https://www.stellarnet.us/spectrometers/uv-vis-spectrometers/blue-wave/',
              'sourceKind':'manufacturer-product-page',
              'processingNote':'Product image discovered from manufacturer page and normalized to 640x480.'
            },
            {
              'file':'hamamatsu-c12880ma.jpg',
              'profiles':['hamamatsu-c12880ma'],
              'sourcePage':'https://www.hamamatsu.com/jp/en/product/optical-sensors/spectrometers/mini-spectrometer/C12880MA.html',
              'sourceKind':'manufacturer-product-page',
              'processingNote':'Product image discovered from manufacturer page and normalized to 640x480.'
            },
            {
              'file':'hamamatsu-c11708ma.jpg',
              'profiles':['hamamatsu-c11708ma'],
              'sourcePage':'https://www.hamamatsu.com/us/en/product/optical-sensors/spectrometers/mini-spectrometer/C11708MA.html',
              'sourceKind':'manufacturer-product-page',
              'processingNote':'Product image discovered from manufacturer page and normalized to 640x480.'
            }
          ]
          provenance.setdefault('assets',[]).extend([x for x in additions if x['file'] not in existing])
          src_path.write_text(json.dumps(provenance,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Validate complete catalog coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          data=json.loads(Path('docs/frontend/data/hardware_profiles.json').read_text())
          missing=[p['profileId'] for p in data['profiles'] if not p.get('imageUrl')]
          assert not missing, 'profiles missing imageUrl: '+', '.join(missing)
          for p in data['profiles']:
            rel=p['imageUrl'].replace('../assets/hardware/','')
            fp=Path('docs/frontend/assets/hardware')/rel
            assert fp.exists(), (p['profileId'],fp)
            with Image.open(fp) as im:
              assert im.size==(640,480), (fp,im.size)
          print('All',len(data['profiles']),'hardware profiles have 640x480 product images.')
          PY
      - name: Commit batch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hardware-image-prep-3.yml
          git add docs/frontend/assets/hardware docs/frontend/data/hardware_profiles.json
          git commit -m "Complete hardware product image catalog"
          git push origin HEAD:startup-hardware-calibration-ux
