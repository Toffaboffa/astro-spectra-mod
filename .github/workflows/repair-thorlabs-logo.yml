name: Repair Thorlabs logo

on:
  push:
    branches:
      - v1.4-startup-polish
    paths:
      - .github/workflows/repair-thorlabs-logo.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4-startup-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pillow pymupdf requests opencv-python-headless numpy
      - name: Extract official Thorlabs wordmark
        shell: bash
        run: |
          python - <<'PY'
          import io, requests, fitz
          from PIL import Image
          from pathlib import Path

          url='https://www.thorlabs.com/images/TabImages/Thorlabs_OEM_Brochure_0116.pdf'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=45)
          r.raise_for_status()
          doc=fitz.open(stream=r.content,filetype='pdf')
          page=doc[0]
          pix=page.get_pixmap(matrix=fitz.Matrix(3.0,3.0),alpha=False)
          im=Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGB')
          w,h=im.size

          import numpy as np, cv2
          arr=np.array(im)
          rr=arr[:,:,0].astype(np.int16)
          gg=arr[:,:,1].astype(np.int16)
          bb=arr[:,:,2].astype(np.int16)

          # Find the official red THORLABS wordmark anywhere on the cover instead of
          # relying on a guessed page crop. Dilate horizontally so the letters become
          # one logical component.
          red=((rr>70)&((rr-gg)>20)&((rr-bb)>20)).astype(np.uint8)*255
          joined=cv2.dilate(red,cv2.getStructuringElement(cv2.MORPH_RECT,(35,7)),iterations=1)
          n,labels,stats,centroids=cv2.connectedComponentsWithStats(joined,8)
          candidates=[]
          for i in range(1,n):
            x,y,cw,ch,area=stats[i]
            if area<80 or cw<70 or ch<8: continue
            # Logo candidate should be a wide, shallow red component, not the tall
            # decorative red band on the left side of the brochure.
            ratio=cw/max(1,ch)
            if ratio<2.0: continue
            score=cw*ch + x*0.15 + y*0.05
            candidates.append((score,x,y,cw,ch,area,ratio))
          print('THORLABS_CANDIDATES',sorted(candidates,reverse=True)[:12])
          if not candidates:
            raise SystemExit('No plausible red Thorlabs wordmark candidate found')

          _,x,y,cw,ch,area,ratio=max(candidates)
          pad_x=max(18,int(cw*0.06)); pad_y=max(14,int(ch*0.35))
          region=im.crop((max(0,x-pad_x),max(0,y-pad_y),min(w,x+cw+pad_x),min(h,y+ch+pad_y))).convert('RGBA')

          # Make the white page transparent while preserving the official red mark.
          data=[]
          for pr,pg,pb,pa in region.getdata():
            d=(255-pr)+(255-pg)+(255-pb)
            if d < 45:
              data.append((255,255,255,0))
            else:
              alpha=max(0,min(255,int((d-30)*3.2)))
              data.append((pr,pg,pb,alpha))
          region.putdata(data)
          abox=region.getchannel('A').getbbox()
          if not abox:
            raise SystemExit('Thorlabs transparency extraction produced no logo')
          crop=region.crop(abox)
          crop.thumbnail((280,88),Image.Resampling.LANCZOS)
          canvas=Image.new('RGBA',(320,120),(0,0,0,0))
          canvas.alpha_composite(crop,((320-crop.width)//2,(120-crop.height)//2))
          out=Path('docs/frontend/assets/hardware/logos/thorlabs.png')
          canvas.save(out,'PNG',optimize=True)

          alpha=canvas.getchannel('A')
          bbox=alpha.getbbox()
          print('THORLABS_OUTPUT',canvas.size,'bbox',bbox,'source_crop',crop.size)
          if not bbox:
            raise SystemExit('Thorlabs logo output empty')
          bw=bbox[2]-bbox[0]; bh=bbox[3]-bbox[1]
          if bw < 110 or bh < 18 or bw > 300 or bh > 105:
            raise SystemExit(f'Unexpected Thorlabs logo occupancy: {bbox}')
          PY
      - name: Update provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/frontend/assets/hardware/sources.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          for item in data.get('logos',[]):
            if item.get('manufacturer')=='Thorlabs':
              item['sourcePage']='https://www.thorlabs.com/images/TabImages/Thorlabs_OEM_Brochure_0116.pdf'
              item['sourceKind']='manufacturer-document-logo'
              item['processingNote']='Official THORLABS wordmark extracted from the OEM Solutions brochure cover and normalized to a transparent 320x120 UI asset.'
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Commit repaired logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-thorlabs-logo.yml
          git add docs/frontend/assets/hardware/logos/thorlabs.png docs/frontend/assets/hardware/sources.json
          git commit -m "Repair Thorlabs manufacturer logo"
          git push origin HEAD:v1.4-startup-polish
