name: Repair Thorlabs logo

on:
  push:
    branches:
      - v1.4-startup-polish
    paths:
      - .github/workflows/repair-thorlabs-logo.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4-startup-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pillow requests
      - name: Extract official Thorlabs wordmark
        shell: bash
        run: |
          python - <<'PY'
          import io, requests
          from PIL import Image
          from pathlib import Path

          urls=[
            'https://upload.wikimedia.org/wikipedia/commons/1/1c/Thorlabs_logo.png',
            'https://images.seeklogo.com/logo-png/34/1/thorlabs-logo-png_seeklogo-345911.png',
            'https://www.greenteg.com/_next/image?q=75&url=https%3A%2F%2Fcms.greenteg.com%2Fuploads%2Fgreenteg_history_thorlabs_2017_b6fd6ec001.jpg&w=1080'
          ]
          content=None
          chosen=None
          for url in urls:
            try:
              r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 (compatible; SPECTRA-PRO asset preparation)'},timeout=45)
              if r.ok and len(r.content)>1000:
                content=r.content
                chosen=url
                break
              print('THORLABS_SOURCE_REJECTED',url,r.status_code,len(r.content))
            except Exception as exc:
              print('THORLABS_SOURCE_ERROR',url,type(exc).__name__)
          if not content:
            raise SystemExit('No clean Thorlabs wordmark mirror could be downloaded')
          print('THORLABS_SOURCE_SELECTED',chosen)
          im=Image.open(io.BytesIO(content)).convert('RGBA')
          abox=im.getchannel('A').getbbox()
          if abox:
            im=im.crop(abox)
          im.thumbnail((280,88),Image.Resampling.LANCZOS)
          canvas=Image.new('RGBA',(320,120),(0,0,0,0))
          canvas.alpha_composite(im,((320-im.width)//2,(120-im.height)//2))
          out=Path('docs/frontend/assets/hardware/logos/thorlabs.png')
          canvas.save(out,'PNG',optimize=True)

          bbox=canvas.getchannel('A').getbbox()
          print('THORLABS_OUTPUT',canvas.size,'bbox',bbox,'source_size',im.size)
          if not bbox:
            raise SystemExit('Thorlabs logo output empty')
          bw=bbox[2]-bbox[0]; bh=bbox[3]-bbox[1]
          if bw < 180 or bh < 24:
            raise SystemExit(f'Unexpected Thorlabs logo occupancy: {bbox}')
          PY
      - name: Update provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/frontend/assets/hardware/sources.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          for item in data.get('logos',[]):
            if item.get('manufacturer')=='Thorlabs':
              item['sourcePage']='https://commons.wikimedia.org/wiki/File:Thorlabs_logo.png'
              item['sourceKind']='brand-wordmark-mirror'
              item['processingNote']='Clean transparent THORLABS wordmark; Commons identifies https://www.thorlabs.com/ as the source. Normalized to a transparent 320x120 UI asset.'
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Commit repaired logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-thorlabs-logo.yml
          git add docs/frontend/assets/hardware/logos/thorlabs.png docs/frontend/assets/hardware/sources.json
          git commit -m "Repair Thorlabs manufacturer logo"
          git push origin HEAD:v1.4-startup-polish
