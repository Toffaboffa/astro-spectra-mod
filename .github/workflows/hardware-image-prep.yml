name: Prepare hardware image batch 1

on:
  push:
    branches:
      - startup-hardware-calibration-ux
    paths:
      - .github/workflows/hardware-image-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: startup-hardware-calibration-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image tooling
        run: python -m pip install --quiet pillow
      - name: Download real product photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hardware-src docs/frontend/assets/hardware
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          echo 'SOURCE: Spectra-1'
          curl -A "$UA" -L --fail --retry 3 'https://kvant-laser.de/wp-content/uploads/2025/08/schulungs-und-bildungsmaterial-laser-astro-physik_3.webp' -o /tmp/hardware-src/spectra-1.webp
          echo 'SOURCE: Vernier'
          curl -A "$UA" -L --fail --retry 3 'https://www.carolina.com/images/product/large/118044.jpg' -o /tmp/hardware-src/vernier.jpg
          echo 'SOURCE: PASCO'
          curl -A "$UA" -L --fail --retry 3 'https://www.lennoxeducational.ie/26977-medium_default/wireless-spectrometer.jpg' -o /tmp/hardware-src/pasco.jpg
          echo 'SOURCE: Ocean ST'
          curl -A "$UA" -L --fail --retry 3 'https://www.eastwestsvc.com/wp-content/uploads/2022/09/Ocean-ST.png' -o /tmp/hardware-src/ocean.png
          echo 'SOURCE: Avantes'
          curl -A "$UA" -L --fail --retry 3 'https://img.instrumenthive.com/raw_images/IH-029481-1.webp' -o /tmp/hardware-src/avantes.webp
      - name: Normalize product photos
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path

          items = {
              "spectra-1": "/tmp/hardware-src/spectra-1.webp",
              "vernier-gdx-svispl": "/tmp/hardware-src/vernier.jpg",
              "pasco-ps-2600a": "/tmp/hardware-src/pasco.jpg",
              "ocean-st": "/tmp/hardware-src/ocean.png",
              "avantes-uls2048cl-evo": "/tmp/hardware-src/avantes.webp",
          }

          outdir = Path("docs/frontend/assets/hardware")
          outdir.mkdir(parents=True, exist_ok=True)

          def trim_near_white(im):
              rgb = im.convert("RGB")
              px = rgb.load()
              mask = Image.new("L", rgb.size, 0)
              mp = mask.load()
              for y in range(rgb.height):
                  for x in range(rgb.width):
                      r,g,b = px[x,y]
                      if min(r,g,b) < 246 or max(r,g,b)-min(r,g,b) > 10:
                          mp[x,y] = 255
              box = mask.getbbox()
              if not box:
                  return rgb
              l,t,r,b = box
              pad = max(8, int(max(rgb.size) * 0.025))
              return rgb.crop((max(0,l-pad), max(0,t-pad), min(rgb.width,r+pad), min(rgb.height,b+pad)))

          for name, src in items.items():
              im = Image.open(src).convert("RGB")
              im = trim_near_white(im)
              im.thumbnail((570, 390), Image.Resampling.LANCZOS)
              canvas = Image.new("RGB", (640, 480), "white")
              x = (640-im.width)//2
              y = (480-im.height)//2
              canvas.paste(im, (x,y))
              canvas.save(outdir / f"{name}.jpg", "JPEG", quality=84, optimize=True, progressive=True)
          PY
      - name: Add image URLs and provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("docs/frontend/data/hardware_profiles.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          urls = {
              "spectra-1": "../assets/hardware/spectra-1.jpg",
              "vernier-gdx-svispl": "../assets/hardware/vernier-gdx-svispl.jpg",
              "pasco-ps-2600a": "../assets/hardware/pasco-ps-2600a.jpg",
              "ocean-st-uv-25": "../assets/hardware/ocean-st.jpg",
              "ocean-st-vis-25": "../assets/hardware/ocean-st.jpg",
              "ocean-st-nir-25": "../assets/hardware/ocean-st.jpg",
              "avantes-uls2048cl-evo-custom": "../assets/hardware/avantes-uls2048cl-evo.jpg",
          }
          for profile in data.get("profiles", []):
              if profile.get("profileId") in urls:
                  profile["imageUrl"] = urls[profile["profileId"]]
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          provenance = {
              "schema": "spectra-pro-hardware-image-sources/v1",
              "note": "Product-photo sources used to prepare normalized 640x480 UI assets. Images remain attributable to their respective source owners/manufacturers.",
              "assets": [
                  {
                      "file": "spectra-1.jpg",
                      "profiles": ["spectra-1"],
                      "sourceUrl": "https://kvant-laser.de/wp-content/uploads/2025/08/schulungs-und-bildungsmaterial-laser-astro-physik_3.webp",
                      "sourcePage": "https://kvant-laser.de/online-shop/lasermodule/education/spektrometrie/spectra-1-high-resolution-spectrometer/"
                  },
                  {
                      "file": "vernier-gdx-svispl.jpg",
                      "profiles": ["vernier-gdx-svispl"],
                      "sourceUrl": "https://www.carolina.com/images/product/large/118044.jpg",
                      "sourcePage": "https://www.vernier.com/product/go-direct-spectrovis-plus-spectrophotometer/"
                  },
                  {
                      "file": "pasco-ps-2600a.jpg",
                      "profiles": ["pasco-ps-2600a"],
                      "sourceUrl": "https://www.lennoxeducational.ie/26977-medium_default/wireless-spectrometer.jpg",
                      "sourcePage": "https://www.pasco.com/products/sensors/wireless/wireless-spectrometer-vis"
                  },
                  {
                      "file": "ocean-st.jpg",
                      "profiles": ["ocean-st-uv-25","ocean-st-vis-25","ocean-st-nir-25"],
                      "sourceUrl": "https://www.eastwestsvc.com/wp-content/uploads/2022/09/Ocean-ST.png",
                      "sourcePage": "https://www.oceanoptics.com/spectrometers/microspectrometers/"
                  },
                  {
                      "file": "avantes-uls2048cl-evo.jpg",
                      "profiles": ["avantes-uls2048cl-evo-custom"],
                      "sourceUrl": "https://img.instrumenthive.com/raw_images/IH-029481-1.webp",
                      "sourcePage": "https://www.avantes.com/products/spectrometers/starline/avaspec-uls/avaspec-uls2048cl-evo/"
                  }
              ]
          }
          (Path("docs/frontend/assets/hardware")/"sources.json").write_text(
              json.dumps(provenance, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY
      - name: Validate prepared assets
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          expected = [
            "spectra-1.jpg",
            "vernier-gdx-svispl.jpg",
            "pasco-ps-2600a.jpg",
            "ocean-st.jpg",
            "avantes-uls2048cl-evo.jpg",
          ]
          for name in expected:
              p=Path("docs/frontend/assets/hardware")/name
              assert p.exists(), name
              with Image.open(p) as im:
                  assert im.size == (640,480), (name,im.size)
                  assert im.mode == "RGB", (name,im.mode)
          PY
      - name: Commit batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp-hardware/test.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/frontend/assets/hardware docs/frontend/data/hardware_profiles.json .tmp-hardware/test.txt
          git commit -m "Add first hardware product image batch"
          git push origin HEAD:startup-hardware-calibration-ux
