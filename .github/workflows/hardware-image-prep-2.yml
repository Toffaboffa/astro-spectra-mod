name: Prepare hardware image batch 2

on:
  push:
    branches:
      - startup-hardware-calibration-ux
    paths:
      - .github/workflows/hardware-image-prep-2.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: startup-hardware-calibration-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image tooling
        run: python -m pip install --quiet pillow
      - name: Download real product photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hardware-src docs/frontend/assets/hardware
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          echo 'SOURCE: Vernier Visible'
          curl -A "$UA" -L --fail --retry 3 'https://www.fybikon.no/image/dataloggingsutstyr/go-direct-selvstendige-sensorer/28145-gdx-spec-vis.hero.001.jpg' -o /tmp/hardware-src/vernier-visible.jpg
          echo 'SOURCE: Vernier Fluorescence/UV-VIS'
          curl -A "$UA" -L --fail --retry 3 'https://labstuff.eu/images/product_images/original_images/GoDirect_Fluo_UVVIS_a.jpg' -o /tmp/hardware-src/vernier-fuv.jpg
          echo 'SOURCE: PASCO UV-Vis'
          curl -A "$UA" -L --fail --retry 3 'https://tecnoedu.com/Pasco/img/SE3607F.jpg' -o /tmp/hardware-src/pasco-uvvis.jpg
          echo 'SOURCE: Thorlabs CCS series'
          curl -A "$UA" -L --fail --retry 3 'https://www.optolab.ftn.uns.ac.rs/images/EQUIPMENT/img/CCD_Spectrometer_A1-780.jpg' -o /tmp/hardware-src/thorlabs-ccs.jpg
      - name: Normalize product photos
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          outdir = Path("docs/frontend/assets/hardware")
          outdir.mkdir(parents=True, exist_ok=True)

          def trim_near_white(im):
              rgb = im.convert("RGB")
              px = rgb.load()
              mask = Image.new("L", rgb.size, 0)
              mp = mask.load()
              for y in range(rgb.height):
                  for x in range(rgb.width):
                      r,g,b = px[x,y]
                      if min(r,g,b) < 246 or max(r,g,b)-min(r,g,b) > 10:
                          mp[x,y] = 255
              box = mask.getbbox()
              if not box:
                  return rgb
              l,t,r,b = box
              pad = max(8, int(max(rgb.size) * 0.025))
              return rgb.crop((max(0,l-pad), max(0,t-pad), min(rgb.width,r+pad), min(rgb.height,b+pad)))

          def save_ui(src, name, crop=None):
              im = Image.open(src).convert("RGB")
              if crop:
                  im = im.crop(crop)
              im = trim_near_white(im)
              im.thumbnail((570, 390), Image.Resampling.LANCZOS)
              canvas = Image.new("RGB", (640,480), "white")
              canvas.paste(im, ((640-im.width)//2, (480-im.height)//2))
              canvas.save(outdir/name, "JPEG", quality=84, optimize=True, progressive=True)

          save_ui("/tmp/hardware-src/vernier-visible.jpg", "vernier-gdx-spec-vis.jpg")
          save_ui("/tmp/hardware-src/vernier-fuv.jpg", "vernier-gdx-spec-fuv.jpg")
          # Source sheet contains screenshots/accessories above and beside the actual SE-3607.
          # Crop to the real instrument only before normalizing.
          with Image.open("/tmp/hardware-src/pasco-uvvis.jpg") as src:
              w,h = src.size
          save_ui("/tmp/hardware-src/pasco-uvvis.jpg", "pasco-uv-vis.jpg",
                  (0, int(h*0.43), int(w*0.59), h))
          # Official Thorlabs guide image has model caption below the physically shared CCS housing.
          with Image.open("/tmp/hardware-src/thorlabs-ccs.jpg") as src:
              w,h = src.size
          save_ui("/tmp/hardware-src/thorlabs-ccs.jpg", "thorlabs-ccs-series.jpg",
                  (0, 0, w, int(h*0.82)))
          PY
      - name: Add image URLs and provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path("docs/frontend/data/hardware_profiles.json")
          data = json.loads(catalog_path.read_text(encoding="utf-8"))
          urls = {
              "vernier-gdx-spec-vis": "../assets/hardware/vernier-gdx-spec-vis.jpg",
              "vernier-gdx-spec-fuv": "../assets/hardware/vernier-gdx-spec-fuv.jpg",
              "pasco-uv-vis": "../assets/hardware/pasco-uv-vis.jpg",
              "thorlabs-ccs100": "../assets/hardware/thorlabs-ccs-series.jpg",
              "thorlabs-ccs175": "../assets/hardware/thorlabs-ccs-series.jpg",
          }
          for profile in data.get("profiles", []):
              if profile.get("profileId") in urls:
                  profile["imageUrl"] = urls[profile["profileId"]]
          catalog_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          sources_path = Path("docs/frontend/assets/hardware/sources.json")
          provenance = json.loads(sources_path.read_text(encoding="utf-8"))
          provenance["assets"].extend([
              {
                  "file": "vernier-gdx-spec-vis.jpg",
                  "profiles": ["vernier-gdx-spec-vis"],
                  "sourceUrl": "https://www.fybikon.no/image/dataloggingsutstyr/go-direct-selvstendige-sensorer/28145-gdx-spec-vis.hero.001.jpg",
                  "sourcePage": "https://www.vernier.com/product/go-direct-visible-spectrophotometer/"
              },
              {
                  "file": "vernier-gdx-spec-fuv.jpg",
                  "profiles": ["vernier-gdx-spec-fuv"],
                  "sourceUrl": "https://labstuff.eu/images/product_images/original_images/GoDirect_Fluo_UVVIS_a.jpg",
                  "sourcePage": "https://www.vernier.com/products/spectrometers/"
              },
              {
                  "file": "pasco-uv-vis.jpg",
                  "profiles": ["pasco-uv-vis"],
                  "sourceUrl": "https://tecnoedu.com/Pasco/img/SE3607F.jpg",
                  "sourcePage": "https://www.pasco.com/products/lab-apparatus/chemistry/se-3607",
                  "processingNote": "Cropped source composite to the SE-3607 instrument before 640x480 normalization."
              },
              {
                  "file": "thorlabs-ccs-series.jpg",
                  "profiles": ["thorlabs-ccs100","thorlabs-ccs175"],
                  "sourceUrl": "https://www.optolab.ftn.uns.ac.rs/images/EQUIPMENT/img/CCD_Spectrometer_A1-780.jpg",
                  "sourcePage": "https://www.thorlabs.com/catalogpages/Obsolete/2025/CCS100.pdf",
                  "photoSourcePage": "https://www.optolab.ftn.uns.ac.rs/index.php/equipment/optoelectronic-equipment-and-devices/light-analysis/223-ccs200",
                  "representativeFamilyImage": True,
                  "processingNote": "CCS200 laboratory product photo used as representative image of the physically shared CCS-series enclosure."
              }
          ])
          sources_path.write_text(json.dumps(provenance, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Validate prepared assets
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          expected = [
            "vernier-gdx-spec-vis.jpg",
            "vernier-gdx-spec-fuv.jpg",
            "pasco-uv-vis.jpg",
            "thorlabs-ccs-series.jpg",
          ]
          for name in expected:
              p=Path("docs/frontend/assets/hardware")/name
              assert p.exists(), name
              with Image.open(p) as im:
                  assert im.size == (640,480), (name,im.size)
                  assert im.mode == "RGB", (name,im.mode)
          PY
      - name: Commit batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardware-image-prep-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add second hardware product image batch"
          git push origin HEAD:startup-hardware-calibration-ux
