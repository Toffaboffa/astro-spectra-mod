name: Repair StellarNet product image

on:
  push:
    branches:
      - v1.4-startup-polish
    paths:
      - .github/workflows/repair-stellarnet-image.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4-startup-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pillow requests
      - name: Download official BLUE-Wave product photo
        shell: bash
        run: |
          python - <<'PY'
          import io, requests
          from PIL import Image
          from pathlib import Path

          urls=[
            'https://www.stellarnet.us/wp-content/uploads/BLUE-Wave-Spectrometer-side.jpg',
            'https://www.stellarnet.us/wp-content/uploads/BlueWaveWithLogo.png',
            'https://www.stellarnet.us/wp-content/uploads/blue-wave-spectrometer-with-optical-fiber-connected.jpg'
          ]
          H={'User-Agent':'Mozilla/5.0 (compatible; SPECTRA-PRO asset preparation)'}
          content=None
          chosen=None
          for url in urls:
            try:
              r=requests.get(url,headers=H,timeout=40)
              if r.ok and len(r.content)>5000 and r.headers.get('content-type','').startswith('image/'):
                content=r.content
                chosen=url
                break
              print('STELLARNET_SOURCE_REJECTED',url,r.status_code,len(r.content),r.headers.get('content-type'))
            except Exception as exc:
              print('STELLARNET_SOURCE_ERROR',url,type(exc).__name__)
          if not content:
            raise SystemExit('Could not download an official BLUE-Wave product photo')

          im=Image.open(io.BytesIO(content)).convert('RGB')
          print('STELLARNET_SOURCE_SELECTED',chosen,'size',im.size)

          # Trim near-white margins without altering the physical product.
          px=im.load()
          mask=Image.new('L',im.size,0)
          mp=mask.load()
          for y in range(im.height):
            for x in range(im.width):
              r,g,b=px[x,y]
              if min(r,g,b)<244 or max(r,g,b)-min(r,g,b)>12:
                mp[x,y]=255
          box=mask.getbbox()
          if box:
            l,t,r,b=box
            pad=max(10,int(max(im.size)*0.025))
            im=im.crop((max(0,l-pad),max(0,t-pad),min(im.width,r+pad),min(im.height,b+pad)))

          scale=min(570/im.width,390/im.height)
          size=(max(1,round(im.width*scale)),max(1,round(im.height*scale)))
          im=im.resize(size,Image.Resampling.LANCZOS)
          canvas=Image.new('RGB',(640,480),'white')
          canvas.paste(im,((640-im.width)//2,(480-im.height)//2))
          out=Path('docs/frontend/assets/hardware/stellarnet-blue-wave.jpg')
          canvas.save(out,'JPEG',quality=87,optimize=True,progressive=True)

          # Sanity-check occupancy so we do not reintroduce a tiny thumbnail.
          px=canvas.load()
          mask=Image.new('L',canvas.size,0); mp=mask.load()
          for y in range(canvas.height):
            for x in range(canvas.width):
              r,g,b=px[x,y]
              if (255-r)+(255-g)+(255-b)>36 or max(r,g,b)-min(r,g,b)>12:
                mp[x,y]=255
          bbox=mask.getbbox()
          if not bbox:
            raise SystemExit('Normalized StellarNet product image is empty')
          l,t,r,b=bbox
          area=((r-l)*(b-t))/(640*480)
          print('STELLARNET_OUTPUT',bbox,'area',round(area,3))
          if area<0.20:
            raise SystemExit(f'StellarNet product occupancy too small: {area}')
          PY
      - name: Record product-image verification
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/frontend/assets/hardware/sources.json')
          data=json.loads(p.read_text(encoding='utf-8'))

          verification_notes={
            'spectra-1.jpg':'Verified against the real SPECTRA-1 unit and current product reference.',
            'vernier-gdx-svispl.jpg':'Verified against Vernier GDX-SVISPL product/manual imagery.',
            'vernier-gdx-spec-vis.jpg':'Verified against Vernier GDX-SPEC-VIS product/manual imagery.',
            'vernier-gdx-spec-fuv.jpg':'Verified against Vernier GDX-SPEC-FUV product/manual imagery.',
            'pasco-ps-2600a.jpg':'Verified against PASCO PS-2600A product imagery.',
            'pasco-uv-vis.jpg':'Verified against PASCO SE-3607 product imagery.',
            'ocean-st.jpg':'Verified against Ocean Optics ST product sheet/catalog. ST-UV, ST-VIS and ST-NIR share the same ST enclosure.',
            'thorlabs-ccs-series.jpg':'Verified against Thorlabs CCS100/CCS175/CCS200 catalog imagery. The three legacy CCS models share the compact red CCS-family enclosure.',
            'avantes-uls2048cl-evo.jpg':'Verified against Avantes AvaSpec-ULS2048CL-EVO product literature.',
            'stellarnet-blue-wave.jpg':'Replaced with a clean official BLUE-Wave enclosure photo from the StellarNet manufacturer product page.',
            'hamamatsu-c12880ma.jpg':'Verified against Hamamatsu C12880MA product imagery.',
            'hamamatsu-c11708ma.jpg':'Verified against Hamamatsu C11708MA product imagery.'
          }

          for item in data.get('assets',[]):
            fn=item.get('file')
            if fn in verification_notes:
              item['verificationNote']=verification_notes[fn]
              item['verifiedAgainstOfficialProductMaterial']=True
              item['verifiedDate']='2026-09-28'
            if fn=='stellarnet-blue-wave.jpg':
              item['sourcePage']='https://www.stellarnet.us/spectrometers/uv-vis-spectrometers/blue-wave/'
              item['sourceUrl']='https://www.stellarnet.us/wp-content/uploads/BLUE-Wave-Spectrometer-side.jpg'
              item['sourceKind']='manufacturer-product-image'
              item['processingNote']='Official BLUE-Wave side product photo normalized to 640x480; no product geometry altered.'

          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Commit verified product image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-stellarnet-image.yml
          git add docs/frontend/assets/hardware/stellarnet-blue-wave.jpg docs/frontend/assets/hardware/sources.json
          git commit -m "Repair and verify hardware product images"
          git push origin HEAD:v1.4-startup-polish
